
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>enoth.mesh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(127, 6px);
      gap: 0;
      user-select: none;
      touch-action: none;
    }

    .cell {
      width: 6px;
      height: 6px;
      background-color: transparent;
    }

    .axis {
      background-color: #555;
    }

    .active {
      background-color: #4caf50 !important;
    }

    #coords {
      margin-top: 16px;
      font-size: 18px;
    }

    #status {
      margin-top: 8px;
      font-size: 14px;
      font-family: monospace;
    }

    #device {
      margin-top: 4px;
      font-size: 14px;
      font-family: monospace;
    }

    .connected {
      color: #4caf50;
    }

    .disconnected {
      color: #ff5252;
    }
  </style>
</head>

<body>

  <div class="grid" id="grid"></div>

  <div id="coords">X: -, Y: -</div>

  <div id="status" class="disconnected">
    ESP32: connecting...
  </div>

  <div id="device">
    Device: -
  </div>

  <div id="deviceCount">  
    Connecred devices: 0
  </div>

  <script>
    const gridSize = 127;
    const cellSize = 6;

    const grid = document.getElementById("grid");
    const coordsEl = document.getElementById("coords");
    const statusEl = document.getElementById("status");
    const deviceEl = document.getElementById("device");
    const deviceCountEl = document.getElementById("deviceCount");

    const center = Math.floor(gridSize / 2);
    const cells = [];

    let socket = null;
    let espConnected = false;
    let deviceNumber = null;

    let pendingX = 0;
    let pendingY = 0;
    let xyPending = false;

    let lastSend = 0;

    const SEND_INTERVAL = 20;

    const RELAY_URL =
      "https://mesh-relay.onrender.com/ws?role=browser&room=mesh";


    function getDeviceId() {

      let id = sessionStorage.getItem("meshDeviceId");

      if (!id) {
        id = crypto.randomUUID();
        sessionStorage.setItem("meshDeviceId", id);
      }

      return id;
    }
    const DEVICE_ID = getDeviceId();

    let heartbeatTimer = null;

    function connectMesh() {

      socket = new WebSocket(RELAY_URL);

      // socket.onopen = () => {
      //   console.log("Connected to MESH relay");
      // };


      socket.onopen = () => {
      console.log("Connected to MESH relay");

      socket.send(`HELLO,${DEVICE_ID}`);

      heartbeatTimer = setInterval(() => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send("P");
        }
      }, 2000);
    };

      socket.onmessage = (event) => {

        const msg = event.data;

        console.log("RELAY → BROWSER:", msg);

        if (msg.startsWith("C,")) {

          const count =
            Number(msg.split(",")[1]);

          deviceCountEl.textContent =
            "Connected devices: " + count;

          return;
        }

        if (msg.startsWith("S,")) {

          deviceNumber =
            Number(msg.split(",")[1]);

          deviceEl.textContent =
            "Device: " + deviceNumber;

          return;
        }


        if (msg === "E,1") {

          espConnected = true;

          statusEl.textContent =
            "● ESP32 connected";

          statusEl.className =
            "connected";

          return;
        }


        if (msg === "E,0") {

          espConnected = false;

          statusEl.textContent =
            "○ ESP32 disconnected";

          statusEl.className =
            "disconnected";

          return;
        }


        if (msg === "FULL") {

          alert(
            "Maximum number of devices reached."
          );

          return;
        }
      };


      socket.onclose = () => {
        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }

        espConnected = false;

        statusEl.textContent = "○ Relay disconnected";
        statusEl.className = "disconnected";

        setTimeout(connectMesh, 1000);
      };

      socket.onerror = (error) => {

        console.log(
          "MESH WebSocket error",
          error
        );
      };
    }


    function sendCoord(x, y) {

      pendingX =
        Math.max(
          0,
          Math.min(
            126,
            Math.round(x)
          )
        );

      pendingY =
        Math.max(
          0,
          Math.min(
            126,
            Math.round(y)
          )
        );

      xyPending = true;
    }


    function sendLoop() {

      const now =
        performance.now();

      if (
        xyPending &&
        now - lastSend >= SEND_INTERVAL
      ) {

        if (
          socket &&
          socket.readyState === WebSocket.OPEN &&
          espConnected
        ) {

          socket.send(
            `X,${pendingX},${pendingY}`
          );

          lastSend = now;

          xyPending = false;
        }
      }

      requestAnimationFrame(
        sendLoop
      );
    }


    for (
      let y = 0;
      y < gridSize;
      y++
    ) {

      for (
        let x = 0;
        x < gridSize;
        x++
      ) {

        const cell =
          document.createElement("div");

        cell.classList.add("cell");

        if (
          x === center ||
          y === center
        ) {

          cell.classList.add("axis");
        }

        cell.dataset.x = x;
        cell.dataset.y = y;

        grid.appendChild(cell);

        cells.push(cell);
      }
    }


    function updateCoords(
      clientX,
      clientY
    ) {

      const rect =
        grid.getBoundingClientRect();

      const x =
        Math.floor(
          (clientX - rect.left)
          / cellSize
        );

      const y =
        Math.floor(
          (clientY - rect.top)
          / cellSize
        );

      if (
        x >= 0 &&
        x < gridSize &&
        y >= 0 &&
        y < gridSize
      ) {

        coordsEl.textContent =
          "X: " + x +
          ", Y: " + y;

        highlight(x, y);

        sendCoord(x, y);
      }
    }


    function highlight(x, y) {

      cells.forEach(
        (cell, i) => {

          const cx =
            i % gridSize;

          const cy =
            Math.floor(
              i / gridSize
            );

          cell.classList.toggle(
            "active",
            cx === x &&
            cy === y
          );
        }
      );
    }


    grid.addEventListener(
      "mousemove",
      (e) => {

        updateCoords(
          e.clientX,
          e.clientY
        );
      }
    );


    grid.addEventListener(
      "touchmove",
      (e) => {

        if (
          e.touches.length > 0
        ) {

          const touch =
            e.touches[0];

          updateCoords(
            touch.clientX,
            touch.clientY
          );
        }
      }
    );


    connectMesh();

    requestAnimationFrame(
      sendLoop
    );

  </script>

</body>
</html>
